spring.application.name=ms-moderacion
server.port=${PORT:8083}

# Credenciales en db.properties (no se sube a Git) o en variables de entorno (Docker)
spring.config.import=optional:file:./db.properties

# Oracle Cloud (Autonomous Database) con Wallet
spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_NAME}?TNS_ADMIN=${DB_WALLET_PATH}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean con los scripts de la carpeta db/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Origenes permitidos por CORS (separados por coma)
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# Logging
logging.level.root=INFO
logging.level.com.duoc=DEBUG

management.endpoints.web.exposure.include=health,info
